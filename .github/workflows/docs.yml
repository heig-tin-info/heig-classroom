name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - "zensical.fr.toml"
      - "scripts/docs-translate.ts"
      - "scripts/docs-build.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - "zensical.fr.toml"
      - "scripts/docs-translate.ts"
      - "scripts/docs-build.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # English under docs/ is the reference, French under docs/fr/ is generated by
  # `pnpm docs:translate` and committed. This job fails when an English page
  # changed without its French twin being regenerated. No API key is needed:
  # everything is read from docs/.translation-cache.json.
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:translate --check

  build:
    needs: translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          # Creates the Pages site (source "GitHub Actions") if it does not exist.
          enablement: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install zensical
      # English into site/, French into site/fr/.
      - run: bash scripts/docs-build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
