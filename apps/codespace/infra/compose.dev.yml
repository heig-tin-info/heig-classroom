# Environnement de développement : forge Git locale (Forgejo).
# L'IdP OIDC de dev est le Keycloak de classroom (docker-compose.dev.yml à la
# racine, realm hgc-dev, client codespace-portal) : un seul Keycloak pour les deux
# applications ; en production, Switch edu-ID pour les deux.
# Lancement : podman compose -f infra/compose.dev.yml up -d
# Les conteneurs étudiants ne sont PAS ici : le portail les crée dynamiquement.
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__ROOT_URL: http://localhost:3300/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__service__DISABLE_REGISTRATION: "false"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - forgejo-data:/data

volumes:
  forgejo-data:
