# Environnement de développement : IdP OIDC (Keycloak) et forge Git locale (Forgejo).
# Lancement : podman compose -f infra/compose.dev.yml up -d
# Les conteneurs étudiants ne sont PAS ici : le portail les crée dynamiquement.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__ROOT_URL: http://localhost:3300/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__service__DISABLE_REGISTRATION: "false"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - forgejo-data:/data

volumes:
  forgejo-data:
