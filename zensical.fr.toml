# French build of the documentation.
#
# English under `docs/` is the reference; `docs/fr/` is generated from it by
# `pnpm docs:translate`. This configuration mirrors `zensical.toml` — same
# theme, same features, same extensions — and only changes what a second
# language needs: the source directory, the output directory, the language and
# the nav labels. Keep the two files in step.
#
# Build both with `pnpm docs:build` (English into `site/`, French into
# `site/fr/`).

[project]
site_name = "HEIG Classroom"
site_description = "Devoirs adossés à GitHub pour le département TIN de la HEIG-VD : dépôts étudiants, notation par CI, délais de rendu automatiques."
site_author = "Yves Chevallier"
site_url = "https://heig-tin-info.github.io/heig-classroom/fr/"
repo_url = "https://github.com/heig-tin-info/heig-classroom"
docs_dir = "docs/fr"
site_dir = "site/fr"
copyright = """
Copyright &copy; 2026 HEIG-VD, département TIN
"""

nav = [
  { "Accueil" = "index.md" },
  { "Guide" = [
    { "À propos" = "guide/about.md" },
    { "Notation automatique" = "guide/grading.md" },
  ] },
  { "Déploiement" = [
    "deployment/index.md",
    { "GitHub App" = "deployment/github-app.md" },
  ] },
  { "Développement" = [
    "development/index.md",
    { "Analyse des besoins" = "00-analyse-besoins.md" },
    { "Cahier des charges" = "01-cahier-des-charges.md" },
    { "Spécifications fonctionnelles" = "02-specs-fonctionnelles.md" },
    { "Architecture" = "03-architecture.md" },
    { "Étude préliminaire S2 : provisionnement" = "spikes/S2-rapport.md" },
  ] },
]

[project.theme]
language = "fr"
custom_dir = "overrides"
features = [
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/graduation-cap"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Passer en mode clair"

# `prefix` is the path from this build's site root (/fr/) to that language's
# site root, joined with the current page URL by
# `overrides/partials/alternate.html`.
[[project.extra.alternate]]
name = "English"
lang = "en"
prefix = "../"
link = "/heig-classroom/"

[[project.extra.alternate]]
name = "Français"
lang = "fr"
prefix = ""
link = "/heig-classroom/fr/"

[project.extra]
# Pages that document the pipeline itself and stay English-only: the language
# switch hides the other language on them and the first-visit redirect skips
# them.
untranslated = ["TRANSLATION/", "i18n-glossary/"]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/heig-tin-info/heig-classroom"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
